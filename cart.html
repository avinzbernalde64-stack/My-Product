<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINJ - Cart</title>

    <!-- READ ONLY TEXT SCRIPT -->
    <style>
        /* Prevents users from highlighting and copying text on EVERY element */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Allows text selection ONLY inside input boxes */
        input, textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        /* --- CART THEME STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #0a0a0a; /* Dark theme background */
            color: #ffffff;
            line-height: 1.6;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links li a {
            text-decoration: none;
            color: #888;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-links li a:hover {
            color: #fff;
        }

        .cart-icon {
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }

        .cart-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 50px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .cart-items {
            background: #141414; /* Dark card background */
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #222;
            align-items: center;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #222;
        }

        .item-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-details h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #fff;
        }

        .item-details p {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 0;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #444;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .quantity-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .quantity-display {
            width: 30px;
            text-align: center;
            font-weight: 600;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.85rem;
            padding: 0;
            text-align: left;
            margin-top: 10px;
        }

        .remove-btn:hover {
            color: #ff4d4d;
        }

        .item-price {
            font-weight: 700;
            font-size: 1.1rem;
            align-self: center;
            color: #fff;
        }

        .empty-cart {
            text-align: center;
            padding: 50px;
            background: #141414;
            border: 1px solid #333;
            border-radius: 8px;
        }

        .cart-summary {
            background: #141414;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px;
            height: fit-content;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1rem;
            color: #ccc;
        }

        .summary-row.total {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            border-top: 1px solid #333;
            padding-top: 15px;
            margin-top: 15px;
        }

        .btn-checkout {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 18px;
            width: 100%;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }

        .btn-checkout:hover {
            background-color: #dddddd;
        }

        @media (max-width: 768px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 15px 20px;
            }

            .nav-links {
                display: none;
            }

            .cart-container {
                padding: 0 20px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">VINJ</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="cart.html" class="cart-icon">Cart (<span id="cartCount">0</span>)</a>
    </nav>

    <main class="cart-container">
        <h1>Your Shopping Cart</h1>
        <div class="cart-layout">
            <div class="cart-items" id="cartItemsContainer"></div>
            <div class="cart-summary">
                <div class="summary-row"><span>Subtotal</span><span id="subtotalAmount">₱0</span></div>
                <div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
                <div class="summary-row total"><span>Total</span><span id="totalAmount">₱0</span></div>
                <button class="btn-checkout" id="checkoutBtn">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <!-- Include shared script -->
    <script src="script.js"></script>
    <script>
        function renderCart() {
            // Use try-catch to handle different localStorage cart formats gracefully
            let cart = [];
            try {
                cart = getCart();
                // Ensure cart is an array
                if (!Array.isArray(cart)) cart = [];
            } catch (e) {
                console.error("Error reading cart:", e);
                cart = [];
            }

            const container = document.getElementById('cartItemsContainer');

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart"><h2>Your cart is empty.</h2><p>Add some products to see them here!</p></div>';
                document.getElementById('subtotalAmount').innerText = '₱0';
                document.getElementById('totalAmount').innerText = '₱0';
                document.getElementById('cartCount').innerText = '0';
                return;
            }

            let htmlContent = '';
            let subtotal = 0;
            let totalItems = 0;

            cart.forEach((item, index) => {
                // Handle cases where price might be stored differently
                const priceString = typeof item.price === 'string' ? item.price.replace(/[^0-9.-]+/g, "") : item.price;
                const priceNumber = parseFloat(priceString) || 0;
                const qty = parseInt(item.quantity) || 1;
                
                subtotal += priceNumber * qty;
                totalItems += qty;

                const itemTitle = item.title || item.name || 'VINJ Product';
                const itemSize = item.size ? `<p>Size: ${item.size}</p>` : '';
                const itemImage = item.image || 'images/placeholder.png';

                htmlContent += `
                    <div class="cart-item">
                        <img src="${itemImage}" alt="${itemTitle}" class="item-image">
                        <div class="item-details">
                            <h3>${itemTitle}</h3>
                            ${itemSize}
                            <div class="quantity-controls">
                                <button class="quantity-btn" onclick="changeQuantity(${index}, -1)">-</button>
                                <span class="quantity-display">${qty}</span>
                                <button class="quantity-btn" onclick="changeQuantity(${index}, 1)">+</button>
                            </div>
                            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                        </div>
                        <div class="item-price">₱${(priceNumber * qty).toLocaleString()}</div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
            document.getElementById('subtotalAmount').innerText = '₱' + subtotal.toLocaleString();
            document.getElementById('totalAmount').innerText = '₱' + subtotal.toLocaleString();
            document.getElementById('cartCount').innerText = totalItems;
        }

        function changeQuantity(index, change) {
            let cart = getCart();
            if (!cart[index]) return;

            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            saveCart(cart);
            renderCart();
        }

        function removeItem(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
        }

        document.getElementById('checkoutBtn').addEventListener('click', () => {
            const cart = getCart();
            if (cart.length === 0) { 
                alert("Your cart is empty!"); 
                return; 
            }
            
            // Show success message
            alert("Thank you for your purchase! Your order has been placed.");
            
            // CLEAR THE CART
            saveCart([]); // This empties the local storage
            
            // Re-render the page so items disappear immediately
            renderCart();
        });

        // Initialize page on load
        renderCart();
    </script>
</body>

</html>
